
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONU THAKUR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    background:#160000;
    color:white;
    position:relative;
}

/* Ghoomta hua red background */
body::before{
    content:"";
    position:fixed;
    width:180vmax;
    height:180vmax;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:-2;
    background:conic-gradient(
        from 0deg,
        #210000,
        #ff0000,
        #720000,
        #ff3030,
        #3b0000,
        #ff0000,
        #210000
    );
    animation:rotateBackground 12s linear infinite;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
        radial-gradient(
            circle at center,
            transparent 10%,
            rgba(0,0,0,.5) 85%
        );
    pointer-events:none;
}

@keyframes rotateBackground{
    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }
    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}

/* Main Card */
.container{
    width:92%;
    max-width:430px;
    margin:30px auto;
    padding:30px 22px;
    text-align:center;
    border-radius:28px;
    background:rgba(20,0,0,.65);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 0 30px rgba(255,0,0,.12);
    backdrop-filter:blur(15px);
}

/* Heading */
h1{
    font-size:34px;
    letter-spacing:4px;
    font-weight:900;
    margin-bottom:8px;
    text-shadow:0 0 20px rgba(255,50,50,.8);
}

.subtitle{
    color:#ffd1d1;
    font-size:14px;
    margin-bottom:25px;
    letter-spacing:2px;
}

/* Profile Image */
.profile{
    width:210px;
    height:210px;
    margin:0 auto 28px;
    border-radius:50%;
    padding:5px;
    background:linear-gradient(
        135deg,#ff0000,#ff7777,#990000
    );
    box-shadow:0 0 30px rgba(255,0,0,.7);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #180000;
}

/* Buttons */
.buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    padding:16px;
    border-radius:15px;
    text-decoration:none;
    color:white;
    font-size:17px;
    font-weight:bold;
    letter-spacing:.5px;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.btn:hover{
    transform:translateY(-3px) scale(1.02);
}

.btn:active{
    transform:scale(.97);
}

.whatsapp{
    background:linear-gradient(135deg,#25D366,#128C7E);
}

.instagram{
    background:linear-gradient(
        135deg,#833AB4,#FD1D1D,#FCAF45
    );
}

.snapchat{
    background:#FFD600;
    color:#111;
}

.icon{
    width:27px;
    height:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.footer{
    margin-top:28px;
    font-size:12px;
    color:#d8aaaa;
    letter-spacing:1px;
}
</style>
</head>

<body>

<div class="container">

    <h1>MONU THAKUR</h1>
    <div class="subtitle">WELCOME TO MY PROFILE</div>

    <div class="profile">
        <img
            src="https://i.postimg.cc/0QpQ7Wf3/Snapchat-1200991175.jpg"
            alt="MONU THAKUR"
        >
    </div>

    <div class="buttons">

        <a
            class="btn whatsapp"
            href="https://wa.me/919630910932"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">☘</span>
            WhatsApp
        </a>

        <a
            class="btn instagram"
            href="https://www.instagram.com/_rajputanamonu01_/?stkn=MWpnaWp1OXF2Mm13OQ=="
            target="_blank"
            rel="noopener"
        >
            <span class="icon">◎</span>
            Instagram
        </a>

        <a
            class="btn snapchat"
            href="https://www.snapchat.com/add/l18994409?share_id=89j80Zs0WV8&locale=en-IN"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">👻</span>
            Snapchat
        </a>

    </div>

    <div class="footer">
        © 2026 MONU THAKUR
    </div>

</div>

</body>
</html>
